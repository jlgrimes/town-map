name: Restore App.tsx
on:
  push:
    branches: [daisy/discover-first-screen]
    paths:
      - ".restore-app-tsx/**"
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble App.tsx
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          parts_dir = Path('.restore-app-tsx')
          if not parts_dir.exists():
              print('no parts dir; nothing to do')
              raise SystemExit(0)
          parts = sorted(parts_dir.glob('part-*.txt'))
          print('parts', [p.name for p in parts])
          if len(parts) != 16:
              print('waiting for 16 parts, have', len(parts))
              raise SystemExit(0)
          data = ''.join(p.read_text() for p in parts)
          Path('apps/app/src/App.tsx').write_text(data)
          print('chars', len(data), 'bytes', len(data.encode()))
          digest = hashlib.sha256(data.encode()).hexdigest()
          print('sha256', digest)
          print('GamePills', 'GamePills' in data, 'locationResolved', 'locationResolved' in data)
          expected = '2ecad2d91fc44f696ad81e45b2fa3377ecb34cb0a1e99aa6ad3bb9969b8bcf89'
          if digest != expected:
              raise SystemExit('checksum mismatch')
          PY
      - name: Commit restored file
        run: |
          if [ ! -d .restore-app-tsx ]; then echo skip; exit 0; fi
          count=$(ls .restore-app-tsx/part-*.txt 2>/dev/null | wc -l)
          if [ "$count" -ne 16 ]; then echo "skip $count parts"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .restore-app-tsx
          git add -A apps/app/src/App.tsx .restore-app-tsx
          git commit -m "Restore Discover first-screen cut (full App.tsx)."
          git push

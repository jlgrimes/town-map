[build]
builder = "RAILPACK"
buildCommand = "pnpm --filter @town-map/api... build"
watchPatterns = ["/apps/api/**", "/packages/contracts/**", "/packages/db/**", "/pnpm-lock.yaml"]

[deploy]
preDeployCommand = "pnpm --filter @town-map/db migrate"
startCommand = "pnpm --filter @town-map/api start"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[build]
builder = "RAILPACK"
buildCommand = "pnpm --filter @town-map/ingest-pokemon... build"
watchPatterns = ["/services/ingest-pokemon/**", "/packages/**", "/pnpm-lock.yaml"]

[deploy]
startCommand = "pnpm --filter @town-map/ingest-pokemon start"
cronSchedule = "57 * * * *"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 2

[build]
builder = "RAILPACK"
buildCommand = "pnpm --filter @town-map/ingest-magic... build"
watchPatterns = ["/services/ingest-magic/**", "/packages/**", "/pnpm-lock.yaml"]

[deploy]
startCommand = "pnpm --filter @town-map/ingest-magic start"
cronSchedule = "17 * * * *"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 2

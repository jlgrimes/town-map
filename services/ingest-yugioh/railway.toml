[build]
builder = "RAILPACK"
buildCommand = "pnpm --filter @town-map/ingest-yugioh... build"
watchPatterns = ["/services/ingest-yugioh/**", "/packages/**", "/pnpm-lock.yaml"]

[deploy]
startCommand = "pnpm --filter @town-map/ingest-yugioh start"
cronSchedule = "37 */6 * * *"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 2

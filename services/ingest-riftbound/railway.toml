[build]
builder = "RAILPACK"
buildCommand = "pnpm --filter @town-map/ingest-riftbound... build"
watchPatterns = ["/services/ingest-riftbound/**", "/packages/**", "/pnpm-lock.yaml"]

[deploy]
startCommand = "pnpm --filter @town-map/ingest-riftbound start"
cronSchedule = "47 * * * *"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 2
